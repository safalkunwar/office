<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Image Upload Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 32px; }
        h1 { text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="file"] { margin-top: 8px; }
        button { padding: 10px 18px; border: none; border-radius: 4px; background: #4285f4; color: #fff; font-size: 16px; cursor: pointer; }
        button:disabled { background: #aaa; }
        .status { margin-top: 18px; font-size: 15px; }
        .success { color: #388e3c; }
        .error { color: #d32f2f; }
        .link { margin-top: 10px; word-break: break-all; }
        .image-preview { margin-top: 16px; max-width: 100%; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fab fa-google-drive"></i> Google Drive Image Upload Demo</h1>
        <div class="form-group">
            <label for="googleClientId">Google Client ID</label>
            <input type="text" id="googleClientId" placeholder="Enter your Google Client ID">
        </div>
        <div class="form-group">
            <label for="googleApiKey">Google API Key</label>
            <input type="text" id="googleApiKey" placeholder="Enter your Google API Key">
        </div>
        <div class="form-group">
            <label for="userEmail">Gmail Address</label>
            <input type="email" id="userEmail" placeholder="Enter your Gmail address">
        </div>
        <div class="form-group">
            <button id="saveCredentialsBtn" type="button">Save Credentials</button>
        </div>
        <div class="form-group">
            <button id="connectDriveBtn" type="button">Connect Google Drive</button>
        </div>
        <div class="form-group">
            <label for="fileInput">Select Image to Upload</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="form-group">
            <button id="uploadBtn" type="button" disabled>Upload Image to Google Drive</button>
        </div>
        <div class="status" id="statusMsg"></div>
        <div class="link" id="fileLink"></div>
        <img id="imagePreview" class="image-preview" style="display:none;" />
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script type="module" src="./js/google-drive.js"></script>
    <script>
        // Save credentials
        document.getElementById('saveCredentialsBtn').onclick = function() {
            const clientId = document.getElementById('googleClientId').value.trim();
            const apiKey = document.getElementById('googleApiKey').value.trim();
            if (!clientId || !apiKey) {
                setStatus('Please enter both Client ID and API Key.', 'error');
                return;
            }
            localStorage.setItem('googleClientId', clientId);
            localStorage.setItem('googleApiKey', apiKey);
            setStatus('Credentials saved. Now connect your Google Drive.', 'success');
        };

        // Connect Google Drive
        document.getElementById('connectDriveBtn').onclick = function() {
            setStatus('Connecting to Google Drive...', '');
            window.initiateGoogleDriveAuth();
            // Enable upload button after auth (with a delay for demo)
            setTimeout(() => {
                document.getElementById('uploadBtn').disabled = false;
                setStatus('Connected! You can now upload an image.', 'success');
            }, 3000);
        };

        // Upload image
        document.getElementById('uploadBtn').onclick = function() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                setStatus('Please select an image to upload.', 'error');
                return;
            }
            setStatus('Uploading image to Google Drive...', '');
            window.uploadFileToDrive(file, function(info) {
                setStatus('Upload successful!', 'success');
                document.getElementById('fileLink').innerHTML = '<a href="' + info.webViewLink + '" target="_blank">View Uploaded Image</a>';
                document.getElementById('imagePreview').src = info.webContentLink;
                document.getElementById('imagePreview').style.display = 'block';
            }, function(err) {
                setStatus('Upload failed: ' + (err.message || err), 'error');
            });
        };

        function setStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status ' + (type || '');
        }
    </script>
</body>
</html>
