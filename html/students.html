<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Management - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="admin-navbar" role="navigation" aria-label="Main navigation">
        <div class="navbar-left">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
        </div>
        <div class="navbar-right">
            <button class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
            <ul>
                <li><a href="../index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="students.html" class="active" aria-current="page"><i class="fas fa-users"></i> Students</a></li>
                <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams</a></li>
                <li><a href="applications.html"><i class="fas fa-university"></i> Applications</a></li>
                <li><a href="documents.html"><i class="fas fa-folder"></i> Documents</a></li>
                <li><a href="messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
                <li><a href="tasks.html"><i class="fas fa-tasks"></i> Tasks</a></li>
                <li><a href="security.html"><i class="fas fa-shield-alt"></i> Security</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </nav>

    <main class="content" role="main">
        <header>
            <h1>Students Management</h1>
            <div class="user-info">
                <span id="userName">Admin</span>
                <a href="login.html" class="logout" aria-label="Logout">Logout</a>
            </div>
        </header>

        <div class="container">
            <!-- Student Filters -->
            <div class="filters-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search students..." aria-label="Search students">
                </div>
                <div class="filter-options">
                    <select id="courseFilter" aria-label="Filter by course">
                        <option value="all">All Courses</option>
                        <option value="ielts">IELTS</option>
                        <option value="pte">PTE</option>
                    </select>
                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="completed">Completed</option>
                    </select>
                    <button class="btn btn-primary" onclick="openCreateStudentModal()">
                        <i class="fas fa-plus"></i> Add Student
                    </button>
                </div>
            </div>

            <!-- Students List -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Status</th>
                            <th>Last Activity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsList">
                        <!-- Students will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="btn btn-secondary" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span class="page-info">Page 1 of 5</span>
                <button class="btn btn-secondary">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Create Student Modal -->
    <div class="modal" id="createStudentModal">
        <div class="modal-content">
            <h2>Add New Student</h2>
            <form id="createStudentForm">
                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" required>
                </div>
                <div class="form-group">
                    <label for="studentEmail">Email</label>
                    <input type="email" id="studentEmail" required>
                </div>
                <div class="form-group">
                    <label for="studentPhone">Phone Number</label>
                    <input type="tel" id="studentPhone" required>
                </div>
                <div class="form-group">
                    <label for="studentCourse">Course</label>
                    <select id="studentCourse" required>
                        <option value="">Select Course</option>
                        <option value="IELTS">IELTS</option>
                        <option value="PTE">PTE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateStudentModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Student</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/students.js"></script>
</body>
</html>
