<main>
  <section class="card panel">
    <div class="head"><h2 data-i18n="nav.assign">Assignments</h2><button class="btn">+ New</button></div>
    <div class="filters">
      <label>Filter <select class="select" id="statusFilter"><option value="all">All</option><option value="pending">Pending</option><option value="submitted">Submitted</option><option value="graded">Graded</option></select></label>
    </div>
    <div class="list" id="assignmentsList"></div>
  </section>

<footer class="site-footer">© 2025 Student Portal • contact@example.com</footer>
<script src="lang.js"></script>
    <div class="filters">
      <label>Filter <select class="select" id="statusFilter"><option value="all">All</option><option value="pending">Pending</option><option value="submitted">Submitted</option><option value="graded">Graded</option></select></label>
    </div>

<script>
  const data = [
    { title:'Essay Writing', subject:'IELTS', due:'2025-08-20', status:'pending' },
    { title:'Listening Drill 3', subject:'PTE', due:'2025-08-25', status:'submitted' },
    { title:'Reading Set 4', subject:'IELTS', due:'2025-08-28', status:'graded' }
  ];
  const el = document.getElementById('assignmentsList');
  const render = (rows)=> el.innerHTML = rows.map(a=>`<div class="item">
    <div><strong>${a.title}</strong><div class="meta"><span>${a.subject}</span><span data-i18n="due">Due</span> <span>${a.due}</span></div></div>
    <div><span class="badge ${a.status==='graded'?'success':a.status==='submitted'?'pending':'warning'}">${a.status}</span></div>
  </div>`).join('');
  render(data);
  document.getElementById('statusFilter').addEventListener('change', (e)=>{
    const v = e.target.value;
    const rows = v==='all'? data : data.filter(x=>x.status===v);
    render(rows);
  });

</script>
</body>
</html>
