<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Documents</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/html/student/style.css">
  <script defer src="student/lang.js"></script>
</head>
<body>
<header class="site-header"><div class="header-wrap">
  <div class="brand"><div class="logo"></div> <span data-i18n="brand">Student Portal</span></div>
  <nav class="site-nav">
    <a href="student/index.html">📊 <span data-i18n="nav.dash">Dashboard</span></a>
    <a href="student/courses.html">📘 <span data-i18n="nav.courses">Courses</span></a>
    <a href="student/assignments.html">📝 <span data-i18n="nav.assign">Assignments</span></a>
    <a href="student/attendance.html">🗓️ <span data-i18n="nav.attend">Attendance</span></a>
    <a href="student/visa.html">🛂 <span data-i18n="nav.visa">Visa</span></a>
    <a href="messages.html">✉️ <span data-i18n="nav.msg">Messages</span></a>
    <a href="student/resources.html">📚 <span data-i18n="nav.res">Resources</span></a>
    <a href="student/profile.html">👤 <span data-i18n="nav.profile">Profile</span></a>
  </nav>
  <div class="controls"><button id="langToggle" class="btn">EN/NE</button></div>
</div></header>

<main>
  <section class="card panel">
    <div class="head"><h2>My Documents</h2></div>
    <div class="filters">
      <div class="btn-group">
        <button class="btn active" data-filter="all">All</button>
        <button class="btn" data-filter="provided">Provided</button>
        <button class="btn" data-filter="missing">Missing</button>
      </div>
    </div>
    <div class="doc-grid" id="docGrid"></div>
  </section>

  <section class="card panel" style="margin-top:12px">
    <div class="head"><h3>Assignments</h3></div>
    <div class="doc-grid" id="assGrid"></div>
  </section>

  <section class="card panel" style="margin-top:12px">
    <div class="head"><h3>Other Files</h3></div>
    <div class="doc-grid" id="otherGrid"></div>
  </section>
</main>

<footer class="site-footer">© 2025 Student Portal • contact@example.com</footer>
<script>
  async function loadData(){
    try{
      const res = await fetch('student-data.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('No data');
      return await res.json();
    }catch(e){
      return {
        documents:[
          { name:'Passport', status:'Provided', date:'2025-08-01', img:'https://picsum.photos/seed/passport/400/240', url:'#' },
          { name:'Bank Statement', status:'Missing', img:'https://picsum.photos/seed/bank/400/240' },
          { name:'Offer Letter', status:'Provided', date:'2025-07-28', img:'https://picsum.photos/seed/offer/400/240', url:'#' },
          { name:'SOP', status:'Missing', img:'https://picsum.photos/seed/sop/400/240' }
        ],
        assignments:[
          { title:'Essay Writing', deadline:'2025-08-20', status:'pending' },
          { title:'Reading Set 4', deadline:'2025-08-28', status:'graded' }
        ],
        otherFiles:[
          { name:'Visa Form', status:'Provided', date:'2025-07-20', img:'https://picsum.photos/seed/visa/400/240' }
        ]
      }
    }
  }

  const grid = id => document.getElementById(id);
  function card(d){ return `
    <article class="card anim doc-card">
      ${d.img?`<img src="${d.img}" alt="">`:''}
      <div class="head"><strong>${d.name||d.title}</strong>
        ${d.status?`<span class="badge ${d.status==='Provided'?'success':'warning'}">${d.status}</span>`:''}
      </div>
      <div class="muted">${d.date||d.deadline||''}</div>
      <div style="margin-top:8px;display:flex;gap:.35rem">
        ${d.url?`<a class="btn" href="${d.url}">View</a>`:`<button class="btn" ${d.status==='Missing'?'':'disabled'}>Upload</button>`}
      </div>
    </article>`; }

  loadData().then(data=>{
    const { documents=[], assignments=[], otherFiles=[] } = data;
    const docsGrid = grid('docGrid');
    const assGrid = grid('assGrid');
    const othGrid = grid('otherGrid');

    function renderDocs(items){ docsGrid.innerHTML = items.map(card).join(''); }
    renderDocs(documents);

    // filters
    document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const v=b.getAttribute('data-filter');
      if(v==='all') return renderDocs(documents);
      renderDocs(documents.filter(d=>d.status && d.status.toLowerCase()===v));
    }));

    assGrid.innerHTML = assignments.map(a=> card({ title:a.title, deadline:a.deadline, status:a.status, img:'https://picsum.photos/seed/ass/400/240'})).join('');
    othGrid.innerHTML = otherFiles.map(card).join('');
  });
</script>
</body>
</html>
