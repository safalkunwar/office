<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Documents - Student Portal</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="student-navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-graduation-cap"></i> Student Portal
            </div>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="documents.html" class="active"><i class="fas fa-folder"></i> Documents</a>
                <a href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
                <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
            </div>
        </div>
    </nav>

    <main class="content" role="main">
        <header class="page-header">
            <div class="header-content">
                <h1><i class="fas fa-folder-open"></i> My Documents</h1>
                <p class="header-subtitle">Manage your application documents and requirements</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="uploadBtn">
                    <i class="fas fa-upload"></i> Upload Document
                </button>
            </div>
        </header>

        <!-- Documents Grid -->
        <div class="documents-container" style="margin-top: 2rem;">
            <div class="documents-list" id="myDocumentsList">
                <!-- Documents will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div class="modal" id="uploadDocumentModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-upload"></i> Upload Document</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="studentUploadForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="docName">Document Name</label>
                        <input type="text" id="docName" required placeholder="e.g. Passport Copy">
                    </div>
                    <div class="form-group">
                        <label for="docType">Document Type</label>
                        <select id="docType" required>
                            <option value="passport">Passport</option>
                            <option value="transcript">Academic Transcript</option>
                            <option value="certificate">Language Certificate</option>
                            <option value="cv">CV/Resume</option>
                            <option value="financial">Financial Statement</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="docFile">File</label>
                        <input type="file" id="docFile" required accept=".pdf,.jpg,.png">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close">Cancel</button>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { DocumentsUI } from '../../js/documents.js';
        import { auth } from '../../js/firebase-init.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', () => {
            const ui = new DocumentsUI();
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    ui.loadStudentDocuments(user.uid, 'myDocumentsList');
                } else {
                    window.location.href = '../login.html';
                }
            });

            // Upload Modal Logic
            const modal = document.getElementById('uploadDocumentModal');
            const btn = document.getElementById('uploadBtn');
            const closeBtns = document.querySelectorAll('.modal-close');

            if (btn) btn.onclick = () => modal.style.display = "block";
            closeBtns.forEach(b => b.onclick = () => modal.style.display = "none");

            // Form Submit
            document.getElementById('studentUploadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const user = auth.currentUser;
                if (!user) return;

                const file = document.getElementById('docFile').files[0];
                const metadata = {
                    name: document.getElementById('docName').value,
                    type: document.getElementById('docType').value
                };

                try {
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                    submitBtn.disabled = true;

                    await ui.system.uploadDocument(user.uid, file, metadata);
                    
                    modal.style.display = "none";
                    e.target.reset();
                    ui.loadStudentDocuments(user.uid, 'myDocumentsList');
                    alert('Document uploaded successfully!');
                } catch (error) {
                    console.error(error);
                    alert('Upload failed: ' + error.message);
                } finally {
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    submitBtn.innerHTML = 'Upload';
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
