<script>
  const data=[
    { title:'IELTS Reading PDF', type:'pdf' },
    { title:'PTE Speaking Video', type:'video' },
    { title:'Visa Guidelines', type:'pdf' }
  ];
  const g=document.getElementById('resGrid');
  g.innerHTML = data.map(r=>`<article class="card"><h3 style="margin:0 0 6px">${r.title}</h3><div class="muted">${r.type.toUpperCase()}</div><div style="margin-top:8px"><a href="#" class="btn">Open</a> <a href="#" class="btn">Save</a></div></article>`).join('');
</script>
