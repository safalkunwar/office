<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Admin Dashboard</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Admin Sidebar -->
        <nav class="sidebar admin-sidebar">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
            <ul>
                <li><a href="../../index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="dashboard.html"><i class="fas fa-gauge"></i> Dashboard</a></li>
                <li><a href="employees.html"><i class="fas fa-users"></i> Employees</a></li>
                <li><a href="tasks.html"><i class="fas fa-tasks"></i> Tasks</a></li>
                <li><a href="messages.html" class="active"><i class="fas fa-comments"></i> Messages</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="content">
            <header class="content-header">
                <h1>Messages</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openNewMessageModal()">
                        <i class="fas fa-plus"></i> New Message
                    </button>
                    <div class="message-type-selector">
                        <button class="btn btn-secondary active" data-type="internal">
                            <i class="fas fa-comments"></i> Internal
                        </button>
                        <button class="btn btn-secondary" data-type="whatsapp">
                            <i class="fab fa-whatsapp"></i> WhatsApp
                        </button>
                        <button class="btn btn-secondary" data-type="email">
                            <i class="fas fa-envelope"></i> Email
                        </button>
                    </div>
                </div>
            </header>

            <div class="messaging-container">
                <!-- Conversations List -->
                <div class="conversation-list">
                    <div class="search-box">
                        <input type="text" id="searchConversations" placeholder="Search conversations...">
                    </div>
                    <div class="conversations" id="conversationsList">
                        <!-- Conversations will be loaded here -->
                    </div>
                </div>

                <!-- Message Thread -->
                <div class="message-thread">
                    <div class="message-header">
                        <div class="recipient-info">
                            <img id="recipientAvatar" src="../../assets/default-avatar.png" alt="Recipient">
                            <div>
                                <h3 id="recipientName">Select a conversation</h3>
                                <p id="recipientStatus">Offline</p>
                            </div>
                        </div>
                        <div class="message-actions">
                            <button class="btn btn-icon" onclick="startVideoCall()">
                                <i class="fas fa-video"></i>
                            </button>
                            <button class="btn btn-icon" onclick="startVoiceCall()">
                                <i class="fas fa-phone"></i>
                            </button>
                            <button class="btn btn-icon" onclick="toggleMute()">
                                <i class="fas fa-bell-slash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="messages" id="messagesList">
                        <!-- Messages will be loaded here -->
                    </div>

                    <div class="message-input">
                        <div class="input-actions">
                            <button class="btn btn-icon" onclick="attachFile()">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <button class="btn btn-icon" onclick="recordVoice()">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button class="btn btn-icon" onclick="sendLocation()">
                                <i class="fas fa-map-marker-alt"></i>
                            </button>
                        </div>
                        <textarea id="messageInput" placeholder="Type a message..."></textarea>
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- New Message Modal -->
    <div id="newMessageModal" class="modal">
        <div class="modal-content">
            <h2>New Message</h2>
            <form id="newMessageForm">
                <div class="form-group">
                    <label for="messageType">Message Type</label>
                    <select id="messageType" required>
                        <option value="internal">Internal Message</option>
                        <option value="whatsapp">WhatsApp</option>
                        <option value="email">Email</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="recipients">Recipients</label>
                    <select id="recipients" multiple required>
                        <!-- Populated by JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="messageSubject">Subject</label>
                    <input type="text" id="messageSubject" required>
                </div>
                <div class="form-group">
                    <label for="messageContent">Message</label>
                    <textarea id="messageContent" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="messageAttachments">Attachments</label>
                    <input type="file" id="messageAttachments" multiple>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Send Message</button>
                    <button type="button" class="btn" onclick="closeModal('newMessageModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div id="filePreviewModal" class="modal">
        <div class="modal-content">
            <h2>File Preview</h2>
            <div id="filePreviewContent">
                <!-- File preview will be loaded here -->
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="closeModal('filePreviewModal')">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/admin/messages.js"></script>
</body>
</html>
