<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Data</title>
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
  <header>
    <h1>Add Data</h1>
  </header>
  
  <main>
    <form id="dataForm">
      <label for="metric">Metric:</label>
      <select id="metric" name="metric">
        <option value="visitorsToday">Visitors Today</option>
        <option value="visitorsYesterday">Visitors Yesterday</option>
        <option value="ieltsStudents">IELTS Students</option>
        <option value="applyingStudents">Students Applying</option>
        <option value="pendingStudents">Pending Students</option>
      </select>

      <label for="value">Value:</label>
      <input type="number" id="value" name="value" required>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js"></script>
  <script src="../../js/add.js"></script>
</body>
</html>
