<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Consultancy Management</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Prevent external script injection -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com;">
</head>
<body>
    <!-- Navigation Bar -->
    <admin-navbar></admin-navbar><script type="module" src="../../js/components/navbar.js"></script>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Admin Login</h2>
                <p>Enter your credentials to access the admin panel</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
                <div class="form-group text-center">
                    <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot Password?</a>
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>
            <div id="connectionStatus" class="connection-status">
                <div class="spinner">Testing database connection...</div>
            </div>
        </div>
    </div>

    <!-- Error handling for external script issues -->
    <script>
        // Catch and handle any external script errors
        window.addEventListener('error', function(e) {
            if (e.filename && (e.filename.includes('inspector') || e.filename.includes('ads'))) {
                console.warn('External script error detected:', e.filename);
                // Don't let external script errors affect our app
                e.preventDefault();
            }
        });
    </script>

    <!-- Debug script to identify external scripts -->
    <script src="../../js/debug-external-scripts.js"></script>

    <script type="module" src="../../js/admin/login.js"></script>
</body>
</html>
