<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors Analytics & Registration</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .visitors-container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 32px; }
        .visitors-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .visitors-header h2 { font-size: 1.5rem; margin: 0; }
        .visitors-analytics { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
        .visitors-analytics .stat { font-size: 1.2rem; font-weight: 600; }
        .visitors-analytics select { padding: 4px 12px; border-radius: 4px; border: 1px solid #ccc; }
        .visitors-form { margin-top: 16px; }
        .visitors-form .form-group { margin-bottom: 16px; }
        .visitors-form label { display: block; font-weight: 500; margin-bottom: 6px; }
        .visitors-form input[type="text"],
        .visitors-form input[type="datetime-local"],
        .visitors-form input[type="file"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        .visitors-form input[type="file"] { padding: 2px; }
        .visitors-form .form-actions { text-align: right; }
        .visitors-form button { padding: 8px 24px; border-radius: 4px; border: none; background: #3498db; color: #fff; font-weight: 600; cursor: pointer; }
        .visitors-form button:disabled { background: #ccc; }
        .success-message, .error-message { margin: 12px 0; padding: 10px 16px; border-radius: 4px; font-size: 1rem; }
        .success-message { background: #eafaf1; color: #27ae60; }
        .error-message { background: #fdeaea; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="visitors-container">
        <div class="visitors-header">
            <h2><i class="fas fa-user-friends"></i> Visitors Registration</h2>
            <a href="../index.html" style="font-size:1rem;color:#3498db;text-decoration:none;"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
        <div class="visitors-analytics">
            <div class="stat">Total Visitors: <span id="totalVisitors">0</span></div>
            <select id="visitorsFilter">
                <option value="today">Today</option>
                <option value="week">This Week</option>
                <option value="month">This Month</option>
                <option value="year">This Year</option>
            </select>
        </div>
        <form class="visitors-form" id="visitorForm" enctype="multipart/form-data" autocomplete="off">
            <div class="form-group">
                <label for="visitorName">Full Name</label>
                <input type="text" id="visitorName" name="visitorName" required>
            </div>
            <div class="form-group">
                <label for="visitorContact">Contact Number</label>
                <input type="text" id="visitorContact" name="visitorContact" required pattern="[0-9+\- ]{7,15}">
            </div>
            <div class="form-group">
                <label for="visitorPurpose">Purpose of Visit</label>
                <input type="text" id="visitorPurpose" name="visitorPurpose" required>
            </div>
            <div class="form-group">
                <label for="visitorStaff">Assigned Staff (Optional)</label>
                <input type="text" id="visitorStaff" name="visitorStaff">
            </div>
            <div class="form-group">
                <label for="visitorDateTime">Date & Time</label>
                <input type="datetime-local" id="visitorDateTime" name="visitorDateTime" required>
            </div>
            <div class="form-group">
                <label for="visitorPhoto">Upload Photo</label>
                <input type="file" id="visitorPhoto" name="visitorPhoto" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="submit" id="submitVisitorBtn">Save Visitor</button>
            </div>
            <div id="visitorFormMsg"></div>
        </form>
    </div>
    <script type="module" src="../js/visitors.js"></script>
</body>
</html>
