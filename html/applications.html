<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Management - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="admin-navbar" role="navigation" aria-label="Main navigation">
        <div class="navbar-left">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
        </div>
        <div class="navbar-right">
            <button class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
            <ul>
                <li><a href="../index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
                <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams</a></li>
                <li><a href="applications.html" class="active" aria-current="page"><i class="fas fa-university"></i> Applications</a></li>
                <li><a href="documents.html"><i class="fas fa-folder"></i> Documents</a></li>
                <li><a href="messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
                <li><a href="tasks.html"><i class="fas fa-tasks"></i> Tasks</a></li>
                <li><a href="security.html"><i class="fas fa-shield-alt"></i> Security</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </nav>

    <main class="content" role="main">
        <header>
            <h1>Application Management</h1>
            <div class="user-info">
                <span id="userName">Admin</span>
                <a href="login.html" class="logout" aria-label="Logout">Logout</a>
            </div>
        </header>

        <div class="container">
            <!-- Application Filters -->
            <div class="filters-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search applications..." aria-label="Search applications">
                </div>
                <div class="filter-options">
                    <select id="universityFilter" aria-label="Filter by university">
                        <option value="all">All Universities</option>
                        <option value="University of Toronto">University of Toronto</option>
                        <option value="McGill University">McGill University</option>
                        <option value="University of British Columbia">University of British Columbia</option>
                        <option value="University of Alberta">University of Alberta</option>
                    </select>
                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="under review">Under Review</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <button class="btn btn-primary" onclick="openCreateApplicationModal()">
                        <i class="fas fa-plus"></i> Add Application
                    </button>
                </div>
            </div>

            <!-- Applications List -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Application ID</th>
                            <th>Student</th>
                            <th>University</th>
                            <th>Program</th>
                            <th>Status</th>
                            <th>Submitted Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsList">
                        <!-- Applications will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="btn btn-secondary" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span class="page-info">Page 1 of 5</span>
                <button class="btn btn-secondary">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Create Application Modal -->
    <div class="modal" id="createApplicationModal">
        <div class="modal-content">
            <h2>Add New Application</h2>
            <form id="createApplicationForm">
                <div class="form-group">
                    <label for="studentSelect">Student</label>
                    <select id="studentSelect" required>
                        <option value="">Select Student</option>
                        <!-- Students will be loaded here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="universitySelect">University</label>
                    <select id="universitySelect" required>
                        <option value="">Select University</option>
                        <option value="University of Toronto">University of Toronto</option>
                        <option value="McGill University">McGill University</option>
                        <option value="University of British Columbia">University of British Columbia</option>
                        <option value="University of Alberta">University of Alberta</option>
                        <option value="University of Waterloo">University of Waterloo</option>
                        <option value="University of Ottawa">University of Ottawa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="programSelect">Program</label>
                    <select id="programSelect" required>
                        <option value="">Select Program</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Master's Degree">Master's Degree</option>
                        <option value="PhD">PhD</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Certificate">Certificate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="intakeSelect">Intake</label>
                    <select id="intakeSelect" required>
                        <option value="">Select Intake</option>
                        <option value="Fall 2024">Fall 2024</option>
                        <option value="Spring 2025">Spring 2025</option>
                        <option value="Summer 2025">Summer 2025</option>
                        <option value="Fall 2025">Fall 2025</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="applicationNotes">Notes</label>
                    <textarea id="applicationNotes" rows="3" placeholder="Additional notes about the application..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateApplicationModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Application</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/applications.js"></script>
</body>
</html>
