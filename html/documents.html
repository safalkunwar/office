<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents Management - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="admin-navbar" role="navigation" aria-label="Main navigation">
        <div class="navbar-left">
            <div class="logo">
                <h2>Admin Panel</h2>
            </div>
        </div>
        <div class="navbar-right">
            <button class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
            <ul>
                <li><a href="../index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
                <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams</a></li>
                <li><a href="applications.html"><i class="fas fa-university"></i> Applications</a></li>
                <li><a href="documents.html" class="active" aria-current="page"><i class="fas fa-folder"></i> Documents</a></li>
                <li><a href="messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
                <li><a href="tasks.html"><i class="fas fa-tasks"></i> Tasks</a></li>
                <li><a href="security.html"><i class="fas fa-shield-alt"></i> Security</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </nav>

    <main class="content" role="main">
        <header>
            <h1>Documents Management</h1>
            <div class="user-info">
                <span id="userName">Admin</span>
                <a href="login.html" class="logout" aria-label="Logout">Logout</a>
            </div>
        </header>

        <div class="container">
            <!-- Document Filters -->
            <div class="filters-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search documents..." aria-label="Search documents">
                </div>
                <div class="filter-options">
                    <select id="documentTypeFilter" aria-label="Filter by document type">
                        <option value="all">All Types</option>
                        <option value="application">Application</option>
                        <option value="transcript">Transcript</option>
                        <option value="certificate">Certificate</option>
                        <option value="letter">Letter</option>
                    </select>
                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="verified">Verified</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <button class="btn btn-primary" onclick="openUploadDocumentModal()">
                        <i class="fas fa-upload"></i> Upload Document
                    </button>
                </div>
            </div>

            <!-- Documents List -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Document ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Student</th>
                            <th>Status</th>
                            <th>Uploaded</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="documentsList">
                        <!-- Documents will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="btn btn-secondary" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span class="page-info">Page 1 of 5</span>
                <button class="btn btn-secondary">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Upload Document Modal -->
    <div class="modal" id="uploadDocumentModal">
        <div class="modal-content">
            <h2>Upload New Document</h2>
            <form id="uploadDocumentForm">
                <div class="form-group">
                    <label for="documentName">Document Name</label>
                    <input type="text" id="documentName" required>
                </div>
                <div class="form-group">
                    <label for="documentType">Document Type</label>
                    <select id="documentType" required>
                        <option value="">Select Type</option>
                        <option value="application">Application</option>
                        <option value="transcript">Transcript</option>
                        <option value="certificate">Certificate</option>
                        <option value="letter">Letter</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studentSelect">Student</label>
                    <select id="studentSelect" required>
                        <option value="">Select Student</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="documentFile">Document File</label>
                    <input type="file" id="documentFile" required>
                </div>
                <div class="form-group">
                    <label for="documentNotes">Notes</label>
                    <textarea id="documentNotes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeUploadDocumentModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Upload Document</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/documents.js"></script>
</body>
</html>
