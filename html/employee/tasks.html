<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Employee Portal</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/employee.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <employee-navbar></employee-navbar>
    <script type="module" src="../../js/components/employee-navbar.js"></script>

    <main class="content">
        <header class="page-header">
            <div class="header-content">
                <h1>My Tasks</h1>
                <p class="header-subtitle">Manage your daily to-do list</p>
            </div>
        </header>

        <div class="dashboard-grid">
            <section class="card">
                <div class="card-header">
                    <h3>Add New Task</h3>
                </div>
                <div class="card-body">
                    <form id="addTaskForm">
                        <div class="form-group">
                            <label>Task Title</label>
                            <input type="text" name="title" required placeholder="e.g. Call student X">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Due Date</label>
                                <input type="date" name="dueDate" required>
                            </div>
                            <div class="form-group">
                                <label>Priority</label>
                                <select name="priority">
                                    <option value="High">High</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="Low">Low</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Add Task</button>
                    </form>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h3>Task List</h3>
                </div>
                <div id="tasksList" class="tasks-list">
                    <!-- Loaded by JS -->
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="../../js/employee/tasks.js"></script>
</body>
</html>
