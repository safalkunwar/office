<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Employee Portal</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/employee.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/messages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <employee-navbar></employee-navbar>
    <script type="module" src="../../js/components/employee-navbar.js"></script>

    <main class="content">
        <div class="chat-container">
            <!-- Sidebar -->
            <div class="chat-sidebar">
                <div class="sidebar-header">
                    <h2>Messages</h2>
                    <button class="btn-icon" id="newChatBtn" title="New Chat"><i class="fas fa-edit"></i></button>
                </div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search conversations...">
                </div>
                <div class="conversations-list" id="conversationsList">
                    <!-- Loaded by JS -->
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="no-chat-selected">
                    <i class="far fa-comments"></i>
                    <h3>Select a conversation to start messaging</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- New Chat Modal -->
    <div id="newChatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>New Message</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Select User</label>
                    <select id="userSelect" class="form-control">
                        <option value="">Loading users...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="initialMessage" class="form-control" rows="3"></textarea>
                </div>
                <button id="startChatBtn" class="btn btn-primary btn-block">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { MessagingUI } from '../../js/messaging-ui.js';
        import { auth } from '../../js/firebase-init.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    new MessagingUI();
                } else {
                    window.location.href = '../../login.html';
                }
            });
        });
    </script>
</body>
</html>
