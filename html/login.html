<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Consultancy Management</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="admin-navbar">
        <div class="navbar-left">
            <a href="../../index.html" class="home-link">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
        <div class="navbar-right">
            <a href="../employee/login.html" class="employee-link">
                <i class="fas fa-user"></i> Employee Login
            </a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Admin Login</h2>
                <p>Enter your credentials to access the admin panel</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
                <div class="form-group text-center">
                    <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot Password?</a>
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>
            <div id="connectionStatus" class="connection-status">
                <div class="spinner">Testing database connection...</div>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/admin/login.js"></script>
</body>
</html>
