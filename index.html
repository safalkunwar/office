<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultancy Management System</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #ffffff 0%, #f0f0f0 100%);
        }
        .landing-container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }
        .logo-area {
            margin-bottom: 3rem;
        }
        .logo-area i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .logo-area h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .logo-area p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .role-card {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: transform var(--transition-speed);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid transparent;
        }
        .role-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-color);
        }
        .role-card i {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }
        .role-card h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        .role-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="landing-container animate-fade-in">
        <div class="logo-area">
            <i class="fas fa-graduation-cap"></i>
            <h1>Consultancy Management</h1>
            <p>Select your portal to continue</p>
        </div>

        <div class="role-grid">
            <a href="html/admin/dashboard.html" class="role-card">
                <i class="fas fa-user-shield"></i>
                <h3>Admin</h3>
                <p>System Administration</p>
            </a>
            <a href="html/employee/dashboard.html" class="role-card">
                <i class="fas fa-user-tie"></i>
                <h3>Employee</h3>
                <p>Staff & Instructors</p>
            </a>
            <a href="html/student/dashboard.html" class="role-card">
                <i class="fas fa-user-graduate"></i>
                <h3>Student</h3>
                <p>Learning Portal</p>
            </a>
        </div>
    </div>
</body>
</html>
